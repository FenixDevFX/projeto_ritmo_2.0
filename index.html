<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ritmo – descubra a música</title>

</head>
<body>
<main>
<h1>🎵 Ritmo</h1>
<p class="sub">Cantarole, assobie ou batuque o ritmo. A gente descobre a música.</p>

<section class="stage">
<canvas id="cv" width="440" height="90"></canvas>
<button class="mic" id="mic" aria-label="Começar a ouvir">🎤</button>
<div id="status">Toque e cantarole por alguns segundos</div>
<div class="hint">Dica: 10 a 15 segundos do refrão funcionam melhor</div>
</section>

<section class="results" id="res">
<h2>Possíveis músicas</h2>
<div id="list"></div>
</section>

<section class="hist">
<h2>Histórico</h2>
<div id="hist"><p>Nada por aqui ainda.</p></div>
</section>
</body>
</html>
